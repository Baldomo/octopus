name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libasound2-dev
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: ui
      - if: runner.os == 'Linux'
        run: bun run typecheck
        working-directory: ui
      - if: runner.os == 'Linux'
        run: bun run format:check
        working-directory: ui
      - if: runner.os == 'Linux'
        run: bun run test
        working-directory: ui
      - run: bun run build
        working-directory: ui
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p octopus-cli --no-default-features -- -D warnings
      - run: cargo tree -p octopus-cli --no-default-features -e normal > tree.txt && ! grep -E 'tauri|wry|webkit' tree.txt
      - run: cargo nextest run --workspace
