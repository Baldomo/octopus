name: release

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1,4"
  workflow_dispatch:
    inputs:
      sha:
        description: The release commit to build again
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.event_name == 'schedule' && 'warm' || 'release' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: 0
  DESKTOP_BUNDLE_CONFIG: '{"mainBinaryName":"octopus"}'

jobs:
  version:
    if: github.repository == 'zabealbe/octopus'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.commit.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
      notes: ${{ steps.commit.outputs.notes }}
    steps:
      - id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha || github.sha }}
        run: |
          commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA")
          message=$(jq -r .commit.message <<<"$commit")
          title=$(head -n 1 <<<"$message")
          release='^release: v([0-9]+\.[0-9]+\.[0-9]+)$'
          if [[ ! $title =~ $release ]]; then
            echo "not a release commit: $title"
            exit 0
          fi
          delimiter=$(openssl rand -hex 16)
          {
            echo "version=${BASH_REMATCH[1]}"
            echo "sha=$(jq -r .sha <<<"$commit")"
            echo "notes<<$delimiter"
            tail -n +3 <<<"$message"
            echo "$delimiter"
          } >>"$GITHUB_OUTPUT"

  macos:
    needs: version
    if: github.repository == 'zabealbe/octopus' && needs.version.outputs.version != ''
    runs-on: macos-15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    env:
      BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          version: ${{ needs.version.outputs.version }}
          target: ${{ matrix.target }}
      - run: |
          MACOSX_DEPLOYMENT_TARGET=$(jq -r .bundle.macOS.minimumSystemVersion crates/desktop/tauri.conf.json)
          export MACOSX_DEPLOYMENT_TARGET
          cargo build --release --locked -p octopus-cli --target "$BUILD_TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/octopus
          if-no-files-found: error
          retention-days: 1

  linux:
    needs: version
    if: github.repository == 'zabealbe/octopus' && needs.version.outputs.version != ''
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          version: ${{ needs.version.outputs.version }}
          target: ${{ matrix.target }}
          webkit: true
      - run: |
          cargo build --release --locked -p octopus-cli --target "$BUILD_TARGET"
          (cd crates/desktop && cargo tauri bundle --bundles appimage,deb --target "$BUILD_TARGET" --config "$DESKTOP_BUNDLE_CONFIG")
          mkdir dist
          cp target/"$BUILD_TARGET"/release/bundle/appimage/*.AppImage "dist/octopus_${VERSION}_${ARCH}.AppImage"
          cp target/"$BUILD_TARGET"/release/bundle/deb/*.deb "dist/octopus_${VERSION}_${ARCH}.deb"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  cli:
    needs: version
    if: github.repository == 'zabealbe/octopus' && needs.version.outputs.version != ''
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15
            target: x86_64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          version: ${{ needs.version.outputs.version }}
          target: ${{ matrix.target }}
          cache-save: false
          webkit: ${{ runner.os == 'Linux' }}
      - name: Build the CLI on the desktop build's dependency features, so it compiles from the desktop cache
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            MACOSX_DEPLOYMENT_TARGET=$(jq -r .bundle.macOS.minimumSystemVersion crates/desktop/tauri.conf.json)
            export MACOSX_DEPLOYMENT_TARGET
          fi
          cargo build --release --locked -p octopus-cli -p octopus-desktop --no-default-features --target "$BUILD_TARGET"
          mkdir dist
          tar -czf "dist/octopus-cli_${VERSION}_${BUILD_TARGET}.tar.gz" -C "target/$BUILD_TARGET/release" octopus
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  android:
    needs: version
    if: github.repository == 'zabealbe/octopus' && needs.version.outputs.version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64
            triple: aarch64-linux-android
            arch: arm64
          - target: armv7
            triple: armv7-linux-androideabi
            arch: arm
          - target: i686
            triple: i686-linux-android
            arch: x86
          - target: x86_64
            triple: x86_64-linux-android
            arch: x86_64
    env:
      BUILD_TARGET: ${{ matrix.target }}
      GRADLE_CACHE: |
        ~/.gradle/caches
        ~/.gradle/wrapper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - id: gradle
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GRADLE_CACHE }}
          key: gradle-${{ hashFiles('crates/mobile/gen/android/**/*.gradle*', 'crates/mobile/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - uses: ./.github/actions/setup
        with:
          version: ${{ needs.version.outputs.version }}
          target: ${{ matrix.triple }}
      - working-directory: crates/mobile
        run: NDK_HOME="$ANDROID_NDK_LATEST_HOME" cargo tauri android build --apk --split-per-abi --target "$BUILD_TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-${{ matrix.arch }}
          path: crates/mobile/gen/android/app/build/outputs/apk/${{ matrix.arch }}/release/app-${{ matrix.arch }}-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1
      - if: github.event_name == 'schedule' && matrix.target == 'aarch64' && steps.gradle.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GRADLE_CACHE }}
          key: ${{ steps.gradle.outputs.cache-primary-key }}

  macos-dmg:
    needs: [version, macos]
    if: github.repository == 'zabealbe/octopus' && needs.version.outputs.version != '' && github.event_name != 'schedule'
    runs-on: macos-15
    environment: release
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          version: ${{ needs.version.outputs.version }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: macos-*
          path: ${{ runner.temp }}/macos
      - run: |
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/octopus \
            "$RUNNER_TEMP/macos/macos-aarch64-apple-darwin/octopus" "$RUNNER_TEMP/macos/macos-x86_64-apple-darwin/octopus"
          chmod +x target/universal-apple-darwin/release/octopus
      - name: Bundle, sign and notarize the dmg
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            trap 'rm -f "$APPLE_API_KEY_PATH"' EXIT
            printf '%s\n' "$APPLE_API_KEY_P8" >"$APPLE_API_KEY_PATH"
          else
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY APPLE_API_ISSUER
            export APPLE_SIGNING_IDENTITY=-
          fi
          unset APPLE_API_KEY_P8
          (cd crates/desktop && cargo tauri bundle --bundles dmg --target universal-apple-darwin --config "$DESKTOP_BUNDLE_CONFIG")
          mkdir dist
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg "dist/octopus_${VERSION}_universal.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  android-apk:
    needs: [version, android]
    if: github.repository == 'zabealbe/octopus' && needs.version.outputs.version != '' && github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: android-*
          path: ${{ runner.temp }}/apks
      - name: Merge the per-ABI apks into the universal apk
        run: |
          cd "$RUNNER_TEMP/apks"
          cp android-arm64/app-arm64-release-unsigned.apk universal.apk
          for arch in arm x86 x86_64; do
            unzip -q "android-$arch/app-$arch-release-unsigned.apk" 'lib/*' -d libs
          done
          (cd libs && zip -q -0 -r -D -X ../universal.apk lib)
      - name: Align and sign the apk
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 | sort -V | tail -n 1)"
          "$build_tools/zipalign" -P 16 -f 4 "$RUNNER_TEMP/apks/universal.apk" "$RUNNER_TEMP/apks/aligned.apk"
          keystore="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$keystore"' EXIT
          base64 --decode <<<"$ANDROID_KEYSTORE" >"$keystore"
          mkdir dist
          "$build_tools/apksigner" sign --ks "$keystore" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEYSTORE_PASSWORD \
            --out "dist/octopus_${VERSION}.apk" "$RUNNER_TEMP/apks/aligned.apk"
          "$build_tools/apksigner" verify "dist/octopus_${VERSION}.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [version, linux, cli, macos-dmg, android-apk]
    if: github.repository == 'zabealbe/octopus' && needs.version.outputs.version != '' && github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ needs.version.outputs.sha }}
          NOTES: ${{ needs.version.outputs.notes }}
        run: |
          cd dist
          sha256sum octopus* >SHA256SUMS
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION exists, so this run uploads into it"
          else
            printf '%s\n' "$NOTES" >"$RUNNER_TEMP/notes.md"
            gh release create "v$VERSION" --draft --target "$SHA" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "v$VERSION" octopus* SHA256SUMS --clobber
          gh release edit "v$VERSION" --draft=false --latest
