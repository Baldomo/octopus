[package]
name = "octopus-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
fastrand = "2.5.0"
ignore = "0.4.33"
nix = { version = "0.31.3", features = ["fs", "process", "signal", "socket", "user"] }
notify = "8.2.0"
octopus-proto.workspace = true
portable-pty = "0.9.0"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
uuid = { version = "1.29.0", features = ["v4"] }
which = "8.0.6"
