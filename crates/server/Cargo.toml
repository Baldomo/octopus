[package]
name = "octopus-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
dunce = "1.0.5"
fastrand = "2.5.0"
ignore = "0.4.33"
notify = "8.2.0"
octopus-proto.workspace = true
portable-pty = "0.9.0"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
which = "8.0.6"

[target."cfg(unix)".dependencies]
nix = { version = "0.31.3", features = ["signal"] }

[dev-dependencies]
tempfile = "3.27.0"
