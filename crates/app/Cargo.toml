[package]
name = "octopus-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
gethostname = "1.1.0"
octopus-client.workspace = true
octopus-proto.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["unstable"] }
tokio = { version = "1.54.1", features = ["full"] }
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
