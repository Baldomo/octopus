[package]
name = "octopus-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "octopus"
path = "src/main.rs"

[dependencies]
octopus-proto.workspace = true
octopus-server.workspace = true
octopus-client.workspace = true
octopus-desktop.workspace = true
clap = { version = "4.6.7", features = ["derive", "string"] }
tokio = { version = "1.54.1", features = ["full"] }
serde_json = "1.0.154"
anyhow = "1.0.104"
crossterm = "0.29.0"
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
nix = { version = "0.31.3", features = ["user"] }

[target."cfg(target_os = \"macos\")".dependencies]
tempfile = "3.27.0"

[dev-dependencies]
futures = "0.3.34"
octopus-shell.workspace = true
iroh.workspace = true
iroh-relay.workspace = true
tempfile = "3.27.0"
