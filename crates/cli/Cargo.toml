[package]
name = "octopus-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "octopus"
path = "src/main.rs"

[dependencies]
octopus-proto.workspace = true
octopus-server.workspace = true
octopus-client.workspace = true
octopus-app.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }
serde_json = "1.0.154"
anyhow = "1.0.104"
crossterm = "0.29.0"
dirs = "7.0.0"
gethostname = "1.1.0"
serde = { version = "1.0.229", features = ["derive"] }

[target."cfg(target_os = \"macos\")".dependencies]
nix = { version = "0.31.3", features = ["user"] }

[dev-dependencies]
futures = "0.3.34"
tempfile = "3.27.0"
