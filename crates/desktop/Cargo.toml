[package]
name = "octopus-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
octopus-client.workspace = true
octopus-proto.workspace = true
octopus-shell.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { workspace = true, features = ["devtools", "unstable"] }
tauri-plugin-opener.workspace = true
tauri-plugin-updater.workspace = true
tokio = { workspace = true, features = ["full"] }
ts-rs.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAlert", "NSApplication", "NSButton", "NSControl", "NSEvent", "NSHapticFeedback", "NSResponder", "NSTrackingArea", "NSView", "NSWindow"] }
objc2-core-foundation.workspace = true
objc2-foundation = { workspace = true, features = ["NSError", "NSFileManager", "NSString", "NSURL"] }

[target.'cfg(target_os = "linux")'.dependencies]
dirs.workspace = true
gtk = "0.18.2"
webkit2gtk = "2.0.2"

[build-dependencies]
tauri-build.workspace = true

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
