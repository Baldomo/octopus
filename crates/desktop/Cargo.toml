[package]
name = "octopus-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
cpal = "0.18.2"
octopus-client.workspace = true
octopus-proto.workspace = true
octopus-shell.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["devtools", "unstable"] }
tauri-plugin-opener = "2.7.2"
tokio = { version = "1.54.1", features = ["full"] }
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSEvent", "NSHapticFeedback", "NSResponder", "NSTrackingArea", "NSView", "NSWindow"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
webkit2gtk = "2.0.2"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dev-dependencies]
tauri = { version = "2.12.5", features = ["test"] }
