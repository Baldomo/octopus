[package]
name = "octopus-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
links = "tauri-plugin-octopus"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
cpal = "0.18.2"
octopus-client.workspace = true
octopus-proto.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["devtools", "unstable"] }
tokio = { version = "1.54.1", features = ["full"] }
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }

[build-dependencies]
tauri-plugin = { version = "2.7.2", features = ["build"] }
