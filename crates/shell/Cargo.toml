[package]
name = "octopus-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
links = "tauri-plugin-octopus"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
cpal = "0.18.2"
octopus-client.workspace = true
octopus-proto.workspace = true
getrandom = "0.3.4"
percent-encoding = "2.3.2"
serde.workspace = true
serde_json.workspace = true
tauri = { workspace = true, features = ["devtools", "unstable"] }
tokio = { workspace = true, features = ["full"] }
ts-rs.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSString"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2-core-foundation = { workspace = true, features = ["CFCGTypes", "objc2"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0.2"

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }

[build-dependencies]
tauri-plugin = { version = "2.7.2", features = ["build"] }
