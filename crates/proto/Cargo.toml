[package]
name = "octopus-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
fastrand = "2.5.0"
hex = "0.4.3"
iroh.workspace = true
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "net", "time"] }
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
url = "2.5.8"


[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }
