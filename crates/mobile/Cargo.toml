[package]
name = "octopus-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "octopus_mobile"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
octopus-client.workspace = true
octopus-proto.workspace = true
octopus-shell.workspace = true
tauri.workspace = true
tokio = { workspace = true, features = ["sync"] }

[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
tauri-plugin-barcode-scanner = "2.5.3"
tauri-plugin-opener.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
# Exact, and so for the whole workspace, which resolves one libc: from 0.2.190 libc declares the route and `in6_ifreq`
# items iroh's netwatch and netdev read on iOS for macOS alone.
libc = "=0.2.189"
objc2.workspace = true
objc2-ui-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "block2",
  "UIApplication",
  "UIColor",
  "UICommand",
  "UIDevice",
  "UIEditMenuInteraction",
  "UIFeedbackGenerator",
  "UIGeometry",
  "UIImpactFeedbackGenerator",
  "UIInteraction",
  "UIInterface",
  "UIMenu",
  "UIMenuElement",
  "UINotificationFeedbackGenerator",
  "UIPasteboard",
  "UIResponder",
  "UIScreen",
  "UIScrollView",
  "UISelectionFeedbackGenerator",
  "UIView",
  "UIWindow",
  "objc2-core-foundation",
] }
block2.workspace = true
objc2-core-foundation = { workspace = true, features = ["CFCGTypes"] }
objc2-foundation = { workspace = true, features = [
  "block2",
  "NSArray",
  "NSData",
  "NSDictionary",
  "NSError",
  "NSItemProvider",
  "NSNotification",
  "NSOperation",
  "NSProgress",
  "NSString",
  "NSURL",
  "NSValue",
] }
objc2-avf-audio = { version = "0.3.2", default-features = false, features = [
  "std",
  "block2",
  "AVAudioApplication",
  "AVAudioSession",
  "AVAudioSessionTypes",
] }
security-framework = "3.7.0"

[target.'cfg(target_os = "android")'.dependencies]
base64.workspace = true
serde_json.workspace = true

[build-dependencies]
tauri-build.workspace = true
