[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
octopus-proto = { path = "crates/proto" }
octopus-server = { path = "crates/server" }
octopus-client = { path = "crates/client" }
octopus-shell = { path = "crates/shell" }
octopus-desktop = { path = "crates/desktop" }
# Exact: iroh parses untrusted traffic before octopus authenticates a peer, so a bump is a reviewed change. No
# portmapper, so no router is asked to open a port.
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring", "fast-apple-datapath"] }
iroh-relay = { version = "=1.4.1", default-features = false, features = ["server"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
